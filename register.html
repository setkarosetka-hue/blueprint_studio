<body>

<div class="box">

  <div class="logo">Blueprint Studio</div>

  <div class="subtitle">
    Создание нового аккаунта
  </div>

  <form id="registerForm">

    <div class="field">
      <label for="username">Имя пользователя</label>

      <input
        type="text"
        id="username"
        placeholder="Например: Samuil"
        minlength="3"
        maxlength="30"
        required
      >
    </div>

    <div class="field">
      <label for="displayName">Отображаемое имя</label>

      <input
        type="text"
        id="displayName"
        placeholder="Как вас будут видеть"
        maxlength="50"
        required
      >
    </div>

    <div class="field">
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >
    </div>

    <div class="field">
      <label for="password">Пароль</label>

      <input
        type="password"
        id="password"
        placeholder="Минимум 6 символов"
        minlength="6"
        required
      >
    </div>

    <div class="field">
      <label for="password2">Повторите пароль</label>

      <input
        type="password"
        id="password2"
        placeholder="Повторите пароль"
        minlength="6"
        required
      >
    </div>

    <label class="agreement">
      <input type="checkbox" id="agreement" required>

      <span>
        Я согласен с правилами использования Blueprint Studio.
      </span>
    </label>

    <button type="submit" id="registerButton">
      Зарегистрироваться
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="login-link">
    Уже есть аккаунт?
    <a href="login.html">Войти</a>
  </div>

  <a href="index.html" class="back">
    ← Вернуться на главную
  </a>

</div>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

  const form = document.getElementById("registerForm");
  const button = document.getElementById("registerButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
      document.getElementById("username").value.trim();

    const displayName =
      document.getElementById("displayName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const password2 =
      document.getElementById("password2").value;

    if (password !== password2) {
      showMessage("Пароли не совпадают.", "error");
      return;
    }

    if (password.length < 6) {
      showMessage(
        "Пароль должен содержать минимум 6 символов.",
        "error"
      );
      return;
    }

    button.disabled = true;
    button.textContent = "Регистрация...";

    showMessage("", "");

    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              username: username,
              display_name: displayName
            }
          }

        });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error(
          "Не удалось создать пользователя."
        );
      }

      showMessage(
        "Аккаунт успешно создан! Проверьте почту, если Supabase запросил подтверждение email.",
        "success"
      );

      form.reset();

      setTimeout(() => {
        window.location.href = "account.html";
      }, 1800);

    } catch (error) {

      console.error(error);

      let text = error.message || "Произошла ошибка.";

      if (
        text.toLowerCase().includes("already registered")
      ) {
        text = "Этот email уже зарегистрирован.";
      }

      showMessage(text, "error");

      button.disabled = false;
      button.textContent = "Зарегистрироваться";
    }

  });

</script>

</body>
</html>
