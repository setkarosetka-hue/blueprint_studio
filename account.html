<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Blueprint Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      min-height: 70px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #2563eb;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .nav-links a {
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    .logout {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 9px 13px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 45px 20px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #6b7280;
    }

    .profile {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 23px;
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 18px;
    }

    .profile-name {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
    }

    .profile-name h3 {
      margin-bottom: 4px;
    }

    .profile-name p {
      color: #6b7280;
      font-size: 13px;
    }

    .info {
      border-top: 1px solid #e5e7eb;
      padding-top: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      font-size: 14px;
    }

    .info-row span:first-child {
      color: #6b7280;
    }

    .order-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .order-number {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .order-date {
      color: #6b7280;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      background: #dbeafe;
      color: #1d4ed8;
      white-space: nowrap;
    }

    .status.ready {
      background: #dcfce7;
      color: #166534;
    }

    .status.cancelled {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #6b7280;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 11px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    footer {
      margin-top: 50px;
      padding: 30px 20px;
      background: #111827;
      color: #9ca3af;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      .profile {
        grid-template-columns: 1fr;
      }

      .nav-links a {
        display: none;
      }

      .order {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>

</head>

<body>

<header>
  <nav class="nav">

```
<a class="logo" href="index.html">
  Blueprint Studio
</a>

<div class="nav-links">
  <a href="catalog.html">Каталог</a>
  <a href="order.html">Новый заказ</a>
</div>

<button class="logout" id="logout">
  Выйти
</button>
```

  </nav>
</header>

<main class="container">

  <div class="welcome">
    <h1>Личный кабинет</h1>
    <p>Управляй своим профилем и отслеживай заказы.</p>
  </div>

  <div class="profile">

```
<div class="card">

  <h2>👤 Профиль</h2>

  <div class="profile-name">

    <div class="avatar" id="avatar">
      U
    </div>

    <div>
      <h3 id="displayName">
        Пользователь
      </h3>

      <p id="username">
        @username
      </p>
    </div>

  </div>

  <div class="info">

    <div class="info-row">
      <span>Email</span>
      <strong id="email">
        —
      </strong>
    </div>

    <div class="info-row">
      <span>Аккаунт создан</span>
      <strong id="created">
        —
      </strong>
    </div>

  </div>

</div>

<div class="card">

  <h2>📦 Мои заказы</h2>

  <div id="orders" class="order-list">

    <div class="empty">

      <div class="empty-icon">
        📦
      </div>

      <p>
        Пока заказов нет.
      </p>

      <br>

      <a
        class="btn btn-primary"
        href="order.html"
      >
        Создать заказ
      </a>

    </div>

  </div>

</div>
```

  </div>

</main>

<footer>
  © 2026 Blueprint Studio
</footer>

<script>
  document
    .getElementById("logout")
    .addEventListener("click", function() {

      alert(
        "Выход будет подключён вместе с авторизацией Supabase."
      );

    });
</script>

</body>
</html>
