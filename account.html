
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Мой аккаунт — Blueprint Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #171a21;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      border: 1px solid #475569;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 14px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      padding: 23px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 0;
      border-bottom: 1px solid #edf1f5;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #64748b;
      font-size: 14px;
    }

    .value {
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }

    .orders {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order {
      border: 1px solid #e2e8f0;
      border-radius: 11px;
      padding: 16px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-number {
      font-weight: bold;
    }

    .status {
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
      background: #f1f5f9;
      color: #475569;
    }

    .status.accepted {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status.processing {
      background: #fef3c7;
      color: #92400e;
    }

    .status.ready {
      background: #dcfce7;
      color: #166534;
    }

    .status.completed {
      background: #d1fae5;
      color: #065f46;
    }

    .status.cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .order-info {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 18px;
      display: none;
    }

    .logout {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #dc2626;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .logout:hover {
      background: #b91c1c;
    }

    .new-order {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 15px;
      border-radius: 9px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px;
      }

      .container {
        padding: 22px 12px 40px;
      }

      .card {
        padding: 17px;
      }

      .profile-row {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: left;
      }

      .order-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Blueprint Studio
  </div>

  <a href="index.html" class="back">
    ← На сайт
  </a>

</header>

<main class="container">

  <h1>Мой аккаунт</h1>

  <p class="subtitle">
    Управление профилем и просмотр заказов.
  </p>

  <div id="error" class="error"></div>

  <!-- Профиль -->

  <section class="card">

    <h2>Профиль</h2>

    <div class="profile-row">
      <div class="label">Отображаемое имя</div>
      <div class="value" id="displayName">Загрузка...</div>
    </div>

    <div class="profile-row">
      <div class="label">Имя пользователя</div>
      <div class="value" id="username">Загрузка...</div>
    </div>

    <div class="profile-row">
      <div class="label">Email</div>
      <div class="value" id="email">Загрузка...</div>
    </div>

    <div class="profile-row">
      <div class="label">Дата регистрации</div>
      <div class="value" id="createdAt">Загрузка...</div>
    </div>

  </section>

  <!-- Заказы -->

  <section class="card">

    <h2>Мои заказы</h2>

    <div id="orders" class="orders">

      <div class="loading">
        Загружаем заказы...
      </div>

    </div>

    <a href="order.html" class="new-order">
      + Новый заказ
    </a>

  </section>

  <!-- Выход -->

  <section class="card">

    <h2>Аккаунт</h2>

    <button class="logout" id="logoutButton">
      Выйти из аккаунта
    </button>

  </section>

</main>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
