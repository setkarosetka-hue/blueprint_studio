```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Вход — Blueprint Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #171a21;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }

    .register a {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;

    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">Blueprint Studio</div>

  <div class="subtitle">
    Вход в аккаунт
  </div>

  <form id="loginForm">

    <div class="field">
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >
    </div>

    <div class="field">
      <label for="password">Пароль</label>

      <input
        type="password"
        id="password"
        placeholder="Введите пароль"
        required
      >
    </div>

    <button type="submit" id="loginButton">
      Войти
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="register">
    Нет аккаунта?
    <a href="register.html">Зарегистрироваться</a>
  </div>

  <a href="index.html" class="back">
    ← Вернуться на главную
  </a>

</div>

<!-- Сначала загружаем библиотеку Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Затем наш файл Supabase -->
<script src="./supabase.js"></script>

<script>
  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Вход...";

    try {

      if (typeof supabaseClient === "undefined") {
        throw new Error(
          "Не удалось загрузить supabase.js"
        );
      }

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      if (!data.session) {
        throw new Error("Сессия не была создана.");
      }

      showMessage(
        "Вход выполнен. Переходим в аккаунт...",
        "success"
      );

      setTimeout(function() {
        window.location.href = "account.html";
      }, 700);

    } catch (error) {

      console.error(error);

      let text =
        error.message || "Ошибка входа.";

      if (
        text.toLowerCase().includes(
          "invalid login credentials"
        )
      ) {
        text = "Неверный email или пароль.";
      }

      showMessage(text, "error");

      button.disabled = false;
      button.textContent = "Войти";
    }
  });
</script>

</body>
</html>
